*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg-primary);color:var(--text-primary);font-family:Cairo,Tajawal,sans-serif;transition:background-color .35s,color .35s;overflow-x:hidden}
[data-theme="light"] body{background:linear-gradient(180deg,#F3F8F7,#fff 380px) no-repeat #fff}
h1,h2{font-family:'Aref Ruqaa',Cairo,serif;margin:0}h3,h4,p{margin:0}
button,input,select,textarea{font-family:inherit}button{cursor:pointer;border:0;color:inherit;background:none}a{color:inherit}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.125em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
symbol .d{fill:currentColor;fill-opacity:.17;stroke:none}.ic-fill{fill:currentColor;stroke:none}.ic-fill symbol .d{fill-opacity:1}
.hidden{display:none!important}.f1{flex:1;min-width:0}.rw{display:flex;gap:12px;align-items:center}.sb{justify-content:space-between}
::-webkit-scrollbar{width:7px;height:6px}::-webkit-scrollbar-thumb{background:var(--accent-primary);border-radius:99px}
.brand-logo{display:block;width:150px;aspect-ratio:1100/229;background:var(--logo-url) center/contain no-repeat}
.hd{position:sticky;top:0;z-index:50;background:var(--surface-dock);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border-subtle)}
.hi{max-width:72rem;margin:auto;height:64px;padding:0 14px;display:flex;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:700;color:var(--text-muted);border-inline-start:1px solid var(--border-subtle);padding-inline-start:10px;margin-inline-start:4px}
.ib{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;border:1px solid transparent;position:relative;text-decoration:none;color:var(--text-primary);transition:background-color .2s,color .2s}
.ib:hover{background:var(--accent-soft);color:var(--accent-primary);border-color:var(--border-subtle)}
.ib .s,.ib .m{position:absolute;transition:transform .45s cubic-bezier(.34,1.3,.64,1),opacity .3s}
[data-theme=dark] .ib .m{opacity:0;transform:rotate(-90deg) scale(.4)}[data-theme=light] .ib .s{opacity:0;transform:rotate(90deg) scale(.4)}
#nav{display:flex;gap:2px;margin-inline:auto}
#nav button{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--text-secondary);position:relative;transition:background-color .2s,color .2s}
#nav button .ic{font-size:19px}#nav button:hover{color:var(--accent-primary)}#nav button.on{background:var(--accent-soft);color:var(--accent-primary)}
.nb{position:absolute;top:1px;inset-inline-end:4px;min-width:17px;height:17px;border-radius:9px;background:#E5566D;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#main{max-width:72rem;margin:auto;padding:20px 14px 110px}
.c{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:20px;padding:16px;box-shadow:var(--shadow-soft)}
.cl{cursor:pointer;transition:transform .2s,border-color .2s}.cl:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.si{width:46px;height:46px;border-radius:15px;background:var(--accent-soft);color:var(--accent-primary);display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
.k{font-size:12px;color:var(--text-muted);font-weight:700}.v{font-size:22px;font-weight:800;line-height:1.3}.nm{font-weight:700;font-size:14px}.mt{font-size:12px;color:var(--text-muted)}
.up{color:#2EA06E}.dn{color:#E5566D}h2.t{font-size:26px;color:var(--accent-primary);margin-bottom:12px}h3.t2{font-size:15px;margin:22px 0 10px;display:flex;gap:8px;align-items:center}h3.t2 .ic{color:var(--accent-primary);font-size:18px}
.chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--accent-soft);color:var(--accent-primary);display:inline-flex;gap:4px;align-items:center}
.chip.processing,.chip.low,.chip.review{background:rgba(217,119,6,.15);color:#d97706}.chip.completed,.chip.sourced,.chip.ok{background:rgba(46,160,110,.16);color:#2EA06E}
.chip.cancelled,.chip.returned,.chip.out{background:rgba(229,86,109,.15);color:#E5566D}.chip.shipped{background:rgba(59,130,246,.15);color:#3b82f6}
.fld{width:100%;padding:10px 14px;border-radius:12px;font-size:14px;background:var(--surface-elevated);color:var(--text-primary);border:1px solid var(--border-subtle);outline:0}
.fld:focus{border-color:var(--accent-primary);box-shadow:0 0 0 3px var(--accent-soft)}textarea.fld{resize:vertical}label.l{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin:12px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:700;text-decoration:none;white-space:nowrap;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:scale(1.03)}.btn:active{transform:scale(.96)}.btn.p{background:var(--accent-primary);color:var(--btn-primary-text)}.btn.p:hover{box-shadow:var(--shadow-glow)}
.btn.g{border:1px solid var(--border-strong)}.btn.w{background:linear-gradient(145deg,#3BE57F,#1FBE5E 48%,#0E9A55);color:#fff}.btn.r{color:#E5566D;border:1px solid rgba(229,86,109,.4)}
.btn.b{width:100%}.btn.sm{padding:7px 13px;font-size:12px}.btn[disabled]{opacity:.55;cursor:progress}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar .fld{flex:1;min-width:150px}
.sr{position:relative;flex:2;min-width:200px}.sr .ic{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:18px}.sr .fld{padding-inline-start:40px}
.cr{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}.cr::-webkit-scrollbar{display:none}
.cc{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid var(--border-subtle);background:var(--surface-card);color:var(--text-secondary);white-space:nowrap}
.cc.on{background:var(--accent-primary);color:var(--btn-primary-text);border-color:transparent}.cc .ic{font-size:16px}.cc small{opacity:.75}
.pi{position:relative;background:var(--surface-elevated);color:var(--accent-primary);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex:none}.pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pi.sm{width:46px;height:46px;border-radius:12px;font-size:20px;border:2px solid var(--surface-card)}.th3{display:flex}.th3 .pi+.pi{margin-inline-start:-14px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.pc{padding:0;overflow:hidden;display:flex;flex-direction:column}.pc .pi{aspect-ratio:1;font-size:38px}.pc .bd{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;line-height:1.35}.ab{position:absolute;top:8px;inset-inline-start:8px;z-index:2;display:flex;gap:4px}
.hid{opacity:.55}.tp{height:8px;border-radius:9px;background:linear-gradient(90deg,var(--accent-primary),var(--accent-secondary));margin-top:6px}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent-primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sh{background:var(--surface-card);border:1px solid var(--border-strong);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px;animation:up .28s cubic-bezier(.34,1.2,.64,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}@media(min-width:700px){.ov{align-items:center}.sh{border-radius:26px}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pf{display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:14px;background:var(--surface-elevated);border:1px solid var(--border-subtle);margin-bottom:8px}
.pf .ic{color:var(--accent-primary);font-size:19px}.dz{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px dashed var(--border-strong);border-radius:16px;background:var(--accent-soft)}
.dz .pi{width:84px;height:84px;border-radius:14px}.ai{background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:var(--btn-primary-text)}
.nt{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(217,119,6,.13);color:#d97706;font-size:12.5px;font-weight:700;margin-bottom:12px}.nt .ic{font-size:20px}.nt.in{background:var(--accent-soft);color:var(--accent-primary)}
.toast{position:fixed;top:76px;left:50%;transform:translate(-50%,-170px);background:#2EA06E;color:#fff;padding:10px 20px;border-radius:14px;font-weight:700;z-index:99;transition:transform .3s;max-width:90vw;font-size:13.5px}.toast.show{transform:translate(-50%,0)}

#app::after{content:"";position:fixed;inset:12px;z-index:0;pointer-events:none;border:1px solid var(--border-subtle);border-radius:26px}[data-theme="light"] #app::after{border-color:var(--border-strong)}
#main{position:relative;z-index:1}

/* ===== v2: speed + 3D icons + layout ===== */
.ic,.ic-fill{filter:none!important}
.si .ic,.em .ic{filter:drop-shadow(0 2px 2px rgba(0,0,0,.28))!important}
.ov,.sel,.bkb{backdrop-filter:none;-webkit-backdrop-filter:none}
.pc,.c.cl{content-visibility:auto;contain-intrinsic-size:auto 260px}
.ib,.dl,.si,.cc,#nav button,.av,.sel{transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,background-color .2s,color .2s}
.ib:hover,.dl:hover,.si:hover,.cc:hover,#nav button:hover,.av:hover,.sel:hover{transform:scale(1.15) translateY(-1px)}
.ib:active,.dl:active,.cc:active,#nav button:active,.sel:active{transform:scale(.93)}
.si:hover,.av:hover{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 12px 22px rgba(0,0,0,.28)}
.dl{width:36px;height:36px;color:#fff;border:0;background:linear-gradient(160deg,#F0788C,#D8435D 55%,#B52E48);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.25),0 6px 12px rgba(181,46,72,.35)}
.dl:hover{background:linear-gradient(160deg,#F58A9B,#E24F68 55%,#C23550)}.dl .ic{font-size:18px}
.dl.bk{background:linear-gradient(160deg,#F2B35C,#DB8A1E 55%,#B86D0B);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.25),0 6px 12px rgba(184,109,11,.35)}
.dl.bk.on{background:linear-gradient(160deg,#6FD3A3,#2EA06E 55%,#1F7A52);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.25),0 6px 12px rgba(31,122,82,.35)}
.sel{width:36px;height:36px;border-radius:12px;background:linear-gradient(160deg,var(--surface-elevated),var(--surface-card));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.14),0 6px 12px rgba(0,0,0,.25)}
.sel input,.bkb input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px!important;height:22px!important;border-radius:7px;border:2px solid var(--accent-primary);background:var(--surface-card);display:grid;place-items:center;margin:0;cursor:pointer;box-shadow:inset 0 2px 4px rgba(0,0,0,.18);transition:background .18s,box-shadow .18s}
.sel input:checked,.bkb input[type=checkbox]:checked{background:linear-gradient(160deg,var(--accent-secondary),var(--accent-primary));border-color:transparent;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.25),0 3px 8px var(--accent-soft)}
.sel input:checked::after,.bkb input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--btn-primary-text);border-width:0 2.6px 2.6px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pc .ab{inset-inline-start:8px}.pc .bd .rw{gap:6px}
.stp{display:flex;align-items:flex-start;margin:14px 4px 2px}.stp.bad{margin:10px 0 0}
.sd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;font-size:10.5px;color:var(--text-muted);font-weight:700;text-align:center}
.sd i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-elevated);border:1px solid var(--border-subtle);font-style:normal;font-size:15px;z-index:1;transition:transform .2s}
.sd em{font-style:normal}
.sd::before{content:"";position:absolute;top:14px;inset-inline-start:50%;width:100%;height:3px;border-radius:3px;background:var(--border-subtle)}
.sd:last-child::before{display:none}
.sd.on{color:var(--accent-primary)}
.sd.on i{background:linear-gradient(160deg,var(--accent-secondary),var(--accent-primary));color:var(--btn-primary-text);border-color:transparent;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 4px 9px rgba(0,0,0,.2)}
.sd.on:not(.cur)::before{background:var(--accent-primary)}
.sd.cur i{transform:scale(1.18);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 0 0 4px var(--accent-soft)}
.aim{font-size:12px;margin-top:8px;color:var(--accent-primary);font-weight:700}.aim.bad{color:#E5566D}
.lgr .btn{flex:none}.lgr .tm{white-space:nowrap}

/* ===== v3: calm light mode, softer ornament ===== */
[data-theme="light"]{--bg-primary:#EEF1F0;--bg-secondary:#E8EDEC;--surface-card:#F6F8F7;--surface-elevated:#E6ECEB;--surface-dock:rgba(246,248,247,.94);--text-primary:#26393D;--text-secondary:#4A6064;--text-muted:#7A8D90;--accent-primary:#4A8F89;--accent-hover:#3A7771;--accent-secondary:#78AAA5;--accent-soft:rgba(74,143,137,.09);--border-subtle:rgba(74,143,137,.14);--border-strong:rgba(74,143,137,.32);--shadow-soft:0 6px 18px rgba(30,60,60,.06);--shadow-dock:0 8px 22px rgba(30,60,60,.08);--heading-grad:linear-gradient(90deg,#26393D,#4A8F89,#78AAA5,#3A7771,#26393D);--logo-text:#26393D}
[data-theme="light"] body{background:#EEF1F0}
#app::before{opacity:.09}
[data-theme="light"] #app::before{opacity:.07}
[data-theme="light"] #app::after{border-color:var(--border-subtle)}
[data-theme="light"] .lg::before{opacity:.16}
.dz{cursor:pointer}.dz:hover{border-color:var(--accent-primary)}
.dl.ad{width:26px;height:26px;background:linear-gradient(160deg,var(--accent-secondary),var(--accent-primary));color:var(--btn-primary-text);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 4px 8px rgba(0,0,0,.18)}.dl.ad .ic{font-size:14px}
.pc .bd .rw .btn{min-width:0}

/* ===== v4: interactive order steps, round action buttons, profile ===== */
button.sd{background:none;border:0;padding:0;font-family:inherit;cursor:pointer;color:var(--text-muted)}
.stp.ix .sd:hover i{transform:scale(1.14)}
.sd.s-processing.on{color:#d97706}.sd.s-shipped.on{color:#3b82f6}.sd.s-completed.on{color:#2EA06E}
.sd.s-processing.on i{background:linear-gradient(160deg,#F2B35C,#DB8A1E);color:#fff}
.sd.s-shipped.on i{background:linear-gradient(160deg,#7FB2F7,#3b82f6);color:#fff}
.sd.s-completed.on i{background:linear-gradient(160deg,#6FD3A3,#2EA06E);color:#fff}
.sd.s-processing.on:not(.cur)::before{background:#DB8A1E}.sd.s-shipped.on:not(.cur)::before{background:#3b82f6}.sd.s-completed.on:not(.cur)::before{background:#2EA06E}
.sd.s-processing.cur i{box-shadow:0 0 0 4px rgba(217,119,6,.18)}.sd.s-shipped.cur i{box-shadow:0 0 0 4px rgba(59,130,246,.18)}.sd.s-completed.cur i{box-shadow:0 0 0 4px rgba(46,160,110,.2)}
.dl.wa{background:linear-gradient(160deg,#4BE98C,#1FBE5E 55%,#0E9A55);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.25),0 6px 12px rgba(14,154,85,.35);text-decoration:none}
.dl.wa:hover{background:linear-gradient(160deg,#63F09B,#2BCB6B 55%,#14A85E)}
.dl.ph{background:linear-gradient(160deg,var(--accent-secondary),var(--accent-primary));color:var(--btn-primary-text);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 6px 12px rgba(0,0,0,.18);text-decoration:none}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:96px;height:96px;font-size:38px;border:4px solid var(--surface-card);margin:auto}
.pfc{padding:0;overflow:hidden;text-align:center}
.pcv{height:92px;background:linear-gradient(135deg,var(--accent-secondary),var(--accent-primary));opacity:.85}
.pbody{padding:0 16px 18px;margin-top:-48px}
.pav{position:relative;display:inline-block;cursor:pointer}
.pcam{position:absolute;bottom:2px;inset-inline-end:2px;width:30px;height:30px;border-radius:50%;background:var(--accent-primary);color:var(--btn-primary-text);display:grid;place-items:center;border:3px solid var(--surface-card);font-size:15px}
.pname{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 8px}.pname h3{font-size:21px}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.pst div{background:var(--surface-elevated);border:1px solid var(--border-subtle);border-radius:14px;padding:10px 6px}.pst b{display:block;font-size:19px}.pst span{font-size:11px;color:var(--text-muted);font-weight:700}
.att{display:flex;gap:6px;align-items:center;color:#E5566D;font-size:12px;font-weight:700;margin-top:3px}.att .ic{font-size:15px}

#cf{z-index:120;align-items:center}
.cfb{max-width:380px;border-radius:26px;text-align:center;padding:26px 22px 20px;background:var(--surface-dock);backdrop-filter:blur(14px);position:relative;overflow:hidden}
.cfb::before{content:"";position:absolute;inset:7px;border-radius:20px;border:1px dashed var(--border-subtle);pointer-events:none}
.cfi{width:56px;height:56px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;font-size:27px;background:var(--accent-soft);color:var(--accent-primary);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 7px 16px rgba(0,0,0,.18)}
.cfb.dg .cfi{background:rgba(229,86,109,.14);color:#E5566D}
.cfm{font-size:15px;font-weight:700;line-height:1.9;margin-bottom:6px;position:relative}
.cfb .fld{margin-top:10px;text-align:center}
.cfr{display:flex;gap:10px;margin-top:18px;position:relative}.cfr .btn{flex:1}
.btn.dng{background:linear-gradient(160deg,#F0788C,#D8435D 55%,#B52E48);color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 7px 16px rgba(181,46,72,.35)}

/* تأكيد الحذف: نافذة بشكل الموقع بتظهر جنب الزرار اللي اتضغط */
#cf.pop{background:rgba(8,4,8,.32);align-items:flex-start;justify-content:flex-start;padding:0}
.cfb.pop{overflow:visible;position:fixed;width:300px;max-width:calc(100vw - 24px);padding:18px 16px 14px;border-radius:22px;box-shadow:0 18px 44px rgba(0,0,0,.4);animation:cfp .18s cubic-bezier(.34,1.4,.64,1)}
.cfb.pop .cfi{width:44px;height:44px;border-radius:15px;font-size:22px;margin-bottom:8px}
.cfb.pop .cfm{font-size:14px;line-height:1.8}.cfb.pop .cfr{margin-top:12px}
.cfb.pop .cfr .btn{padding:9px 12px;font-size:13px}
.cfb.pop::after{content:"";position:absolute;width:14px;height:14px;background:var(--surface-dock);border:1px solid var(--border-subtle);transform:rotate(45deg);left:var(--ax,50%);margin-left:-7px;top:-8px;border-right:0;border-bottom:0}
.cfb.pop.up::after{top:auto;bottom:-8px;transform:rotate(225deg)}
@keyframes cfp{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

async function tmFn(b){const t=await tok(),r=await fetch(U+"/functions/v1/smart-action",{method:"POST",headers:{apikey:K,Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify(b)});let j={};try{j=await r.json()}catch(e){}if(!r.ok||j.error)throw new Error(r.status===404?"دالة smart-action غير منشورة بعد (راجع خطوات الشرح)":(j.error||"HTTP "+r.status));return j}

async function tmSave(id){if(demo)return toast("غير متاح في الوضع التجريبي",1);const name=$("tn").value.trim(),un=$("tu").value.trim().toLowerCase(),pw=$("tp").value,sal=Number($("ts").value||0),perms=[...document.querySelectorAll("input[name=pm]:checked")].map(x=>x.value);
