</style></head><body>

<script>
const CAT={"العناية بالجسم": ["لوشن الجسم", "سكراب ومقشر", "زبدة الجسم", "شاور جل"], "العناية بالشعر": ["حمام كريم", "زيوت الشعر", "شامبو وبلسم", "سيروم الشعر", "ماسكات الشعر"], "العناية بالبشرة": ["غسول الوجه", "سيروم البشرة", "كريمات ترطيب", "ماسكات البشرة"], "العطور": ["رجالي", "عطور حريمي", "بادي سبلاش", "مزيل عرق حريمي"], "الإكسسوارات": ["إكسسوارات شعر", "أطقم وعقود", "أساور وخواتم", "حلقان"]},U="https://unnexzitkirtqvhmynwh.supabase.co",K="sb_publishable_ESabG0uyEwunnj3YGYN_og_aghmi7YU",SS="sm-sb-session";
const $=i=>document.getElementById(i),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),n0=n=>Math.round(Number(n)||0).toLocaleString("en-US");
const ST={new:"جديد",processing:"قيد التجهيز",shipped:"تم الشحن",completed:"مكتمل",cancelled:"ملغي",returned:"مرتجع"},RS=["غيّر رأيه","عنوان خاطئ","المنتج غير متوفر","تأخر التوصيل","أخرى"];

let S={p:[],o:[],r:[]},demo=false,tab="ov",F={q:"",st:"",d:""},img="",blob=null,eid=null;
const act=o=>o.status!=="cancelled"&&o.status!=="returned",sum=a=>a.reduce((s,o)=>s+o.total,0),fd=t=>new Date(t).toLocaleDateString("ar-EG",{day:"numeric",month:"short"});
function toast(m,bad){const t=$("toast");t.textContent=m;t.style.background=bad?"#dc2626":"";t.classList.add("show");clearTimeout(toast.x);toast.x=setTimeout(()=>t.classList.remove("show"),bad?3500:1800)}
/* ---- auth + REST ---- */
const gs=()=>{try{return JSON.parse(localStorage.getItem(SS)||"null")}catch(e){return null}};
async function au(g,b){const r=await fetch(`${U}/auth/v1/token?grant_type=${g}`,{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify(b)});if(!r.ok)throw 0;const j=await r.json();return{a:j.access_token,r:j.refresh_token,e:Date.now()/1000+(j.expires_in||3600)}}
async function tok(){let s=gs();if(!s)throw new Error("login");if(s.e-60<Date.now()/1000){try{s=await au("refresh_token",{refresh_token:s.r});localStorage.setItem(SS,JSON.stringify(s))}catch(e){localStorage.removeItem(SS);showLogin();throw new Error("expired")}}return s.a}
async function rq(p,o){o=o||{};const t=await tok(),r=await fetch(U+p,{...o,headers:{apikey:K,Authorization:"Bearer "+t,"Content-Type":"application/json",...(o.headers||{})}});if(!r.ok){let m="";try{m=(await r.json()).message}catch(e){}throw new Error(m||"HTTP "+r.status)}return r.status===204?null:r.text().then(x=>x?JSON.parse(x):null)}
const rs=(p,o)=>rq("/rest/v1/"+p,o);
async function login(e){e.preventDefault();$("le").classList.add("hidden");try{const s=await au("password",{email:$("em").value.trim(),password:$("pw").value});localStorage.setItem(SS,JSON.stringify(s));start()}catch(x){$("le").classList.remove("hidden")}}
function logout(){localStorage.removeItem(SS);location.reload()}function showLogin(){$("app").classList.add("hidden");$("login").classList.remove("hidden")}
/* ---- data ---- */
const mp=r=>({id:r.id,name:r.name,category:r.category,sub:r.sub_category||"",price:Number(r.price)||0,stock:r.stock==null?0:r.stock,desc:r.description||"",image:r.image||"",men:!!r.is_men,pub:r.published!==false});
const mo=r=>({id:r.id,code:r.code,ts:new Date(r.created_at).getTime(),name:r.name,phone:r.phone,city:r.city||"",address:r.address||"",items:r.items||[],total:Number(r.total)||0,shipping:Number(r.shipping)||0,status:r.status,reason:r.cancel_reason||"",rst:!!r.restocked});
const mr=r=>({id:r.id,ts:new Date(r.created_at).getTime(),name:r.name,desc:r.description||"",cat:r.category||"",notes:r.notes||"",cn:r.customer_name||"",phone:r.phone||"",image:r.image_url||"",status:r.status});
async function load(){if(demo)return render();try{const[p,o,r]=await Promise.all([rs("products?select=*&order=id.asc"),rs("orders?select=*&order=created_at.desc"),rs("product_requests?select=*&order=created_at.desc")]);S={p:p.map(mp),o:o.map(mo),r:r.map(mr)};render()}catch(e){$("main").innerHTML=`<div class="c">تعذّر التحميل: ${esc(e.message)}<br><small>تأكد من تشغيل ملف supabase-orders.sql</small></div>`}}
function start(){$("login").classList.add("hidden");$("app").classList.remove("hidden");go("ov");load()}
function startDemo(){demo=true;const D=864e5,now=Date.now(),cs=[["منى أحمد","01012345678","القاهرة"],["سارة علي","01123456789","الجيزة"],["هدى محمود","01234567890","الإسكندرية"],["نورهان سعيد","01555555555","المنصورة"],["ياسمين خالد","01099998888","طنطا"]];
const pr=[["كريم مرطب للوجه",2,120,30],["لوشن الجسم",0,90,4],["زبدة الجسم",0,110,0],["شامبو وبلسم",1,95,15],["سيروم الشعر",1,140,22],["عطر نسائي",3,350,3],["ماسك الشعر",1,85,40],["حلقان لؤلؤ",4,110,18]],ks=Object.keys(CAT);
S.p=pr.map((x,i)=>({id:i+1,name:x[0],category:ks[x[1]===0?0:x[1]===1?1:x[1]===2?2:x[1]===3?3:4],sub:"",price:x[2],stock:x[3],desc:"",image:"",men:false,pub:true}));
const off=[0,0,1,2,3,5,8,12,20,26,31,36,40,44],sts=["new","processing","completed","completed","shipped","completed","cancelled","completed","returned","completed","completed","cancelled","completed","completed"];
S.o=off.map((d,i)=>{const c=cs[i%5],its=[0,1].map(k=>{const p=S.p[(i+k*3)%8];return{id:p.id,name:p.name,qty:1+(i+k)%2,price:p.price}}),sub=its.reduce((s,x)=>s+x.qty*x.price,0);return{id:i+1,code:"SM-"+(4000+i*37),ts:now-d*D-i*3e6,name:c[0],phone:c[1],city:c[2],address:"شارع الجمهورية، "+c[2],items:its,total:sub+45,shipping:45,status:sts[i],reason:sts[i]==="cancelled"?"غيّر رأيه":sts[i]==="returned"?"عنوان خاطئ":"",rst:false}});
const sv=t=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' fill='${t}'/><text x='150' y='160' font-size='40' text-anchor='middle' fill='white'>SKIN</text></svg>`);
S.r=[{id:1,ts:now-2*D,name:"سيروم فيتامين C 30ml",desc:"تركيز 15%",cat:"العناية بالبشرة",notes:"للبشرة الدهنية",cn:"منى أحمد",phone:"01012345678",image:sv("#0B8A7F"),status:"new"},{id:2,ts:now-6*D,name:"سيروم فيتامين C 30ml",desc:"",cat:"",notes:"",cn:"",phone:"01555555555",image:sv("#d97706"),status:"review"},{id:3,ts:now-9*D,name:"بودرة تثبيت شفافة",desc:"درجة فاتحة",cat:"",notes:"",cn:"",phone:"01123456789",image:sv("#7c3aed"),status:"new"}];
$("login").classList.add("hidden");$("app").classList.remove("hidden");go("ov")}
/* ---- views ---- */
function go(t){tab=t;document.querySelectorAll("#nav button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===t));render();scrollTo(0,0)}
function render(){$("main").innerHTML=(demo?'<div class="dm">وضع تجريبي: البيانات وهمية ولا تُحفظ</div>':"")+({ov:vOv,or:vOr,pr:vPr,cu:vCu,rq:vRq})[tab]()}
function card(k,v,s){return`<div class="c"><div class="k">${k}</div><div class="v">${v}</div>${s||""}</div>`}
function vOv(){const now=new Date(),D=864e5,d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),m0=new Date(now.getFullYear(),now.getMonth(),1).getTime(),p0=new Date(now.getFullYear(),now.getMonth()-1,1).getTime(),A=S.o.filter(act);
const td=sum(A.filter(o=>o.ts>=d0)),wk=sum(A.filter(o=>o.ts>=d0-6*D)),mo=A.filter(o=>o.ts>=m0),mt=sum(mo),pm=sum(A.filter(o=>o.ts>=p0&&o.ts<m0)),ch=pm?Math.round((mt-pm)/pm*100):null;
const cx=S.o.filter(o=>!act(o)&&o.ts>=m0),cv=sum(cx),T={},C={},pc=Object.fromEntries(S.p.map(p=>[p.id,p.category]));
mo.forEach(o=>o.items.forEach(i=>{(T[i.name]=T[i.name]||{q:0,r:0}).q+=i.qty;T[i.name].r+=i.qty*i.price;const c=pc[i.id]||"أخرى";C[c]=(C[c]||0)+i.qty}));
const top=Object.entries(T).sort((a,b)=>b[1].q-a[1].q).slice(0,5),tc=Object.entries(C).sort((a,b)=>b[1]-a[1]),mx=top[0]?top[0][1].q:1,low=S.p.filter(p=>p.stock<=5).sort((a,b)=>a.stock-b.stock);
return`<h2>نظرة عامة</h2><div class="g">${card("مبيعات اليوم",n0(td)+" ج")+card("آخر 7 أيام",n0(wk)+" ج")+card("هذا الشهر",n0(mt)+" ج",`<div class="s ${ch>=0?"up":"dn"}">${ch==null?"لا بيانات للشهر السابق":(ch>=0?"▲ ":"▼ ")+Math.abs(ch)+"% عن الشهر السابق ("+n0(pm)+")"}</div>`)}</div>
<h2 style="margin-top:18px;font-size:16px">الجرد هذا الشهر</h2><div class="g">${card("صافي المبيعات",n0(mt)+" ج",`<div class="s">${mo.length} طلب</div>`)+card("ملغي/مرتجع",n0(cv)+" ج",`<div class="s dn">${cx.length} طلب</div>`)+card("إجمالي قبل الإلغاء",n0(mt+cv)+" ج")}</div>
<h2 style="margin-top:18px;font-size:16px">الأكثر مبيعاً (الشهر)</h2><div class="c">${top.map(([n,x])=>`<div style="margin-bottom:10px"><div class="row"><span class="nm">${esc(n)}</span><span class="mt">${x.q} قطعة · ${n0(x.r)} ج</span></div><div class="tp" style="width:${x.q/mx*100}%"></div></div>`).join("")||'<span class="mt">لا مبيعات بعد</span>'}
${tc.length?`<div class="mt" style="margin-top:6px">الأقسام: ${tc.map(([c,q])=>esc(c)+" ("+q+")").join(" · ")}</div>`:""}</div>
<h2 style="margin-top:18px;font-size:16px">تنبيهات المخزون</h2>${low.map(p=>`<div class="it"><div class="f1"><div class="nm">${esc(p.name)}</div><div class="mt">المتبقي: ${p.stock}</div></div><span class="b ${p.stock<=0?"out":"low"}">${p.stock<=0?"نفد":"منخفض"}</span><button class="bt" onclick="op(${p.id})">تحديث</button></div>`).join("")||'<div class="c mt">المخزون سليم ✓</div>'}`}
function ol(){const q=F.q.trim().toLowerCase();return S.o.filter(o=>(!q||o.phone.includes(q)||o.code.toLowerCase().includes(q)||o.name.toLowerCase().includes(q))&&(!F.st||o.status===F.st)&&(!F.d||new Date(o.ts).toLocaleDateString("sv")===F.d)).map(o=>`<div class="it" onclick="oo(${o.id})" style="cursor:pointer"><div class="f1"><div class="nm">${esc(o.code)} · ${esc(o.name)}</div><div class="mt">${esc(o.phone)} · ${fd(o.ts)} · ${o.items.length} صنف</div></div><div style="text-align:end"><div class="nm">${n0(o.total)} ج</div><span class="b ${o.status}">${ST[o.status]||o.status}</span></div></div>`).join("")||'<div class="c mt">لا نتائج</div>'}
function vOr(){return`<div class="row"><h2>الطلبات</h2><button class="bt" onclick="csv('orders')">⬇ CSV</button></div><div class="bar"><input placeholder="🔍 رقم الموبايل / رقم الطلب / الاسم" value="${esc(F.q)}" oninput="F.q=this.value;$('ol').innerHTML=ol()"><select onchange="F.st=this.value;$('ol').innerHTML=ol()"><option value="">كل الحالات</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${F.st===k?"selected":""}>${v}</option>`).join("")}</select><input type="date" value="${F.d}" onchange="F.d=this.value;$('ol').innerHTML=ol()"></div><div id="ol">${ol()}</div>`}
function oo(id){const o=S.o.find(x=>x.id===id),fin=!act(o);$("mb").innerHTML=`<div class="row"><h3 style="margin:0">${esc(o.code)}</h3><button class="bt" onclick="cm()">✕</button></div><p class="mt">${esc(o.name)} · <a href="https://wa.me/2${esc(o.phone)}" target="_blank">${esc(o.phone)}</a><br>${esc(o.city)} — ${esc(o.address)}</p>${o.items.map(i=>`<div class="row mt" style="padding:3px 0"><span>${esc(i.name)} × ${i.qty}</span><span>${n0(i.qty*i.price)} ج</span></div>`).join("")}<div class="row nm" style="margin-top:6px"><span>الإجمالي (شامل شحن ${n0(o.shipping)})</span><span>${n0(o.total)} ج</span></div>
${fin?`<p><span class="b ${o.status}">${ST[o.status]}</span> — السبب: ${esc(o.reason)||"—"}<br><span class="mt">أُعيدت الكمية للمخزون. لا يمكن تغيير الحالة بعد الإلغاء/الإرجاع.</span></p>`:`<label>الحالة</label><select id="os" onchange="$('orr').classList.toggle('hidden',!['cancelled','returned'].includes(this.value))">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${o.status===k?"selected":""}>${v}</option>`).join("")}</select><div id="orr" class="hidden"><label>سبب الإلغاء/الإرجاع *</label><select id="orsn">${RS.map(r=>`<option>${r}</option>`).join("")}</select></div><button class="bt p" style="width:100%;margin-top:14px" onclick="so(${o.id})">حفظ</button>`}`;$("md").classList.remove("hidden")}
async function so(id){const o=S.o.find(x=>x.id===id),st=$("os").value,rsn=["cancelled","returned"].includes(st)?$("orsn").value:"";if(st===o.status)return cm();if(rsn&&!confirm("سيتم إرجاع الكميات للمخزون ولا يمكن التراجع. متأكد؟"))return;
try{if(demo){o.status=st;o.reason=rsn;if(rsn)o.items.forEach(i=>{const p=S.p.find(x=>x.id===i.id);if(p)p.stock+=i.qty})}else await rs("rpc/set_order_status",{method:"POST",body:JSON.stringify({p_id:id,p_status:st,p_reason:rsn})});cm();await load();toast("تم التحديث ✓")}catch(e){toast("فشل: "+e.message,1)}}
function vPr(){return`<div class="row"><h2>المنتجات</h2><button class="bt" onclick="csv('stock')">⬇ جرد CSV</button></div>${S.p.map(p=>`<div class="it" style="${p.pub?"":"opacity:.55"}">${p.image?`<img src="${esc(p.image)}" alt="" onerror="this.style.visibility='hidden'">`:'<div class="ph">✦</div>'}<div class="f1"><div class="nm">${esc(p.name)}</div><div class="mt">${esc(p.category)} · ${n0(p.price)} ج · المخزون ${p.stock} ${p.stock<=0?'<span class="b out">نفد</span>':p.stock<=5?'<span class="b low">منخفض</span>':""} ${p.pub?"":'<span class="b">مخفي</span>'}</div></div><div style="display:flex;flex-direction:column;gap:5px"><button class="bt" onclick="op(${p.id})">تعديل</button><button class="bt" onclick="tg(${p.id})">${p.pub?"إخفاء":"إظهار"}</button></div></div>`).join("")}<button class="fab" onclick="op()">＋ منتج</button>`}
function op(id,pre){eid=id==null?null:id;const p=S.p.find(x=>x.id===eid)||pre||{},cs=Object.keys(CAT),c=p.category||cs[0];img=p.image||"";blob=null;
$("mb").innerHTML=`<div class="row"><h3 style="margin:0">${eid?"تعديل منتج":"منتج جديد"}</h3><button class="bt" onclick="cm()">✕</button></div><label>الصورة</label><div class="row" style="justify-content:flex-start"><img id="fi" src="${esc(img)}" style="width:80px;height:80px;border-radius:12px;object-fit:cover;background:var(--el)"><input type="file" accept="image/*" onchange="pi(event)"></div><label>الاسم *</label><input id="fn" value="${esc(p.name)}"><div class="two"><div><label>القسم</label><select id="fc" onchange="fs()">${cs.map(x=>`<option ${x===c?"selected":""}>${esc(x)}</option>`).join("")}</select></div><div><label>الفرعي</label><select id="fb"></select></div><div><label>السعر *</label><input id="fp" type="number" min="0" value="${p.price==null?"":p.price}"></div><div><label>المخزون *</label><input id="fk" type="number" min="0" value="${p.stock==null?"":p.stock}"></div></div><label>الوصف</label><textarea id="fd" rows="3">${esc(p.desc)}</textarea><label style="display:flex;gap:8px;align-items:center"><input id="fm" type="checkbox" style="width:auto" ${p.men?"checked":""}> رجالي</label><label style="display:flex;gap:8px;align-items:center"><input id="fv" type="checkbox" style="width:auto" ${p.pub===false?"":"checked"}> ظاهر في الموقع</label><div class="row" style="margin-top:14px"><button class="bt p" style="flex:1" onclick="sp()">💾 حفظ</button>${eid?`<button class="bt d" onclick="dp(${eid})">حذف</button>`:""}</div>`;fs(p.sub);$("md").classList.remove("hidden")}
function fs(s){$("fb").innerHTML=(CAT[$("fc").value]||[]).map(x=>`<option ${x===s?"selected":""}>${esc(x)}</option>`).join("")}
function pi(e){const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{blob=b;$("fi").src=URL.createObjectURL(b)},"image/jpeg",.8);URL.revokeObjectURL(u)};i.src=u}
async function sp(){const name=$("fn").value.trim(),price=Number($("fp").value),stock=parseInt($("fk").value);if(!name||$("fp").value===""||!(price>=0)||!(stock>=0))return toast("أكمل الاسم والسعر والمخزون",1);
try{let im=img;if(blob){if(demo)im=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});else{const nm=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";await rq(`/storage/v1/object/product-images/${nm}`,{method:"POST",headers:{"Content-Type":"image/jpeg"},body:blob});im=`${U}/storage/v1/object/public/product-images/${nm}`}}
const row={name,category:$("fc").value,sub_category:$("fb").value,price,stock,description:$("fd").value.trim(),image:im,fallback:im,is_men:$("fm").checked,published:$("fv").checked};
if(demo){const o={id:eid||Date.now(),name,category:row.category,sub:row.sub_category,price,stock,desc:row.description,image:im,men:row.is_men,pub:row.published};const i=S.p.findIndex(x=>x.id===eid);i<0?S.p.push(o):S.p[i]=o}else if(eid)await rs(`products?id=eq.${eid}`,{method:"PATCH",body:JSON.stringify(row)});else await rs("products",{method:"POST",body:JSON.stringify(row)});cm();await load();toast("تم الحفظ ✓")}catch(e){toast("فشل: "+e.message,1)}}
async function tg(id){const p=S.p.find(x=>x.id===id);try{if(demo)p.pub=!p.pub;else await rs(`products?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({published:!p.pub})});await load()}catch(e){toast("فشل: "+e.message,1)}}
async function dp(id){if(!confirm("حذف المنتج نهائياً؟"))return;try{if(demo)S.p=S.p.filter(x=>x.id!==id);else await rs(`products?id=eq.${id}`,{method:"DELETE"});cm();await load()}catch(e){toast("فشل: "+e.message,1)}}
function cus(){const m={};S.o.forEach(o=>{const c=m[o.phone]=m[o.phone]||{name:o.name,phone:o.phone,addr:o.city+" - "+o.address,n:0,sp:0,cx:0,t:0};c.n++;if(o.ts>=c.t){c.t=o.ts;c.name=o.name;c.addr=o.city+" - "+o.address}act(o)?c.sp+=o.total:c.cx++});return Object.values(m).sort((a,b)=>b.sp-a.sp)}
function vCu(){return`<div class="row"><h2>العملاء</h2><button class="bt" onclick="csv('cust')">⬇ CSV</button></div>${cus().map(c=>`<div class="it" onclick="F.q='${esc(c.phone)}';go('or')" style="cursor:pointer"><div class="f1"><div class="nm">${esc(c.name)} · ${esc(c.phone)}</div><div class="mt">${esc(c.addr)}</div></div><div style="text-align:end"><div class="nm">${n0(c.sp)} ج</div><div class="mt">${c.n} طلب${c.cx?` · <span class="dn">${c.cx} ملغي</span>`:""}</div></div></div>`).join("")||'<div class="c mt">لا عملاء بعد</div>'}`}
function vRq(){const k=r=>r.name.trim().toLowerCase(),cn={};S.r.forEach(r=>cn[k(r)]=(cn[k(r)]||0)+1);return`<h2>طلبات المنتجات غير المتوفرة</h2>${S.r.map(r=>`<div class="c" style="margin-bottom:10px"><div style="display:flex;gap:10px">${r.image?`<img src="${esc(r.image)}" alt="" onclick="window.open(this.src)" style="width:90px;height:90px;border-radius:12px;object-fit:cover;cursor:zoom-in">`:'<div class="ph" style="width:90px;height:90px">—</div>'}<div class="f1"><div class="nm">${esc(r.name)} ${cn[k(r)]>1?`<span class="b low">طُلب ${cn[k(r)]} مرات</span>`:""}</div><div class="mt">${esc(r.desc)} ${esc(r.cat)} ${esc(r.notes)}</div><div class="mt">${esc(r.cn)} <a href="https://wa.me/2${esc(r.phone)}" target="_blank">${esc(r.phone)}</a> · ${fd(r.ts)}</div></div></div><div class="row" style="margin-top:8px"><select onchange="sr(${r.id},this.value)">${Object.entries(RQS).map(([a,b])=>`<option value="${a}" ${r.status===a?"selected":""}>${b}</option>`).join("")}</select><button class="bt p" onclick="ra(${r.id})">أضف للمنتجات</button><button class="bt d" onclick="dr(${r.id})">حذف</button></div></div>`).join("")||'<div class="c mt">لا طلبات</div>'}`}
async function sr(id,st){try{if(demo)S.r.find(x=>x.id===id).status=st;else await rs(`product_requests?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:st})});toast("تم ✓")}catch(e){toast("فشل: "+e.message,1)}}
async function dr(id){if(!confirm("حذف الطلب؟"))return;try{if(demo)S.r=S.r.filter(x=>x.id!==id);else await rs(`product_requests?id=eq.${id}`,{method:"DELETE"});await load()}catch(e){toast("فشل: "+e.message,1)}}
function ra(id){const r=S.r.find(x=>x.id===id);go("pr");op(null,{name:r.name,desc:r.desc,image:r.image,category:r.cat&&CAT[r.cat]?r.cat:undefined})}
function csv(w){let h,rows;if(w==="orders"){h=["رقم","التاريخ","الاسم","الموبايل","الحالة","السبب","الإجمالي"];rows=S.o.map(o=>[o.code,new Date(o.ts).toLocaleDateString("sv"),o.name,o.phone,ST[o.status],o.reason,o.total])}else if(w==="cust"){h=["الاسم","الموبايل","العنوان","الطلبات","الإنفاق","الملغي"];rows=cus().map(c=>[c.name,c.phone,c.addr,c.n,c.sp,c.cx])}else{h=["المنتج","القسم","السعر","المخزون","ظاهر"];rows=S.p.map(p=>[p.name,p.category,p.price,p.stock,p.pub?"نعم":"لا"])}
const t=[h,...rows].map(r=>r.map(x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="skinmash-"+w+".csv";a.click()}
function cm(){$("md").classList.add("hidden")}
if(gs())start();else showLogin();
</script></body></html>
